# Doc ownership manifest — the static constraint layer for doc/code sync.
#
# Copy this file next to the skill as `doc-ownership.yaml` and adapt it to
# your project. Each owner entry declares which code it owns (`code` globs),
# which docs must move when that code's behavior changes (`docs`), and which
# functional role knowledge snapshots are eligible to record the durable
# implementation delta (`knowledge_roles`). Ownership and impact edges are
# data, enforced by `scripts/check-doc-sync.sh`, not remembered by anyone.
#
# Enforcement points:
#   - `scripts/check-doc-sync.sh --dirty` before closing a task.
#   - `git commit` PreToolUse hook (tool-specific): staged code matching an
#     owner with none of its docs or eligible role knowledge touched in the
#     index blocks the commit. `[docs-na]` waives only the owned-doc check;
#     `[knowledge-na]` is accepted only with `[docs-na]` for one feature owner.
#
# Semantics:
#   - `docs` is satisfied when ANY listed doc is touched in the same change set.
#     Keep lists tight; adding files weakens the constraint.
#   - `knowledge_roles` is an eligible-role set, not an all-roles checklist. One
#     matching `knowledge/<role-id>.md` must move for every triggered owner.
#     A stale placeholder does not satisfy the gate: the touched snapshot must
#     carry a real captured date, repository baseline, source-backed facts, and
#     a dated Recent Delta.
#   - `knowledge_roles` entries may also be `role: glob` mappings (`glob` may be
#     a comma-separated flow list, one entry per line). When a changed file
#     matches a mapped glob, THAT role's snapshot is the one the gate requires
#     — use mappings to make updates targeted instead of "any eligible role".
#     Plain string entries act as the catch-all: required only when no mapping
#     matches. Mapped globs must name files inside the owner's `code` list;
#     otherwise they never trigger.
#   - `docs_required: false` disables the owned-doc check for an owner. It does
#     not disable the knowledge-snapshot requirement; only the controlled
#     single-feature `[knowledge-na]` lane can do that.
#   - `kind: feature` owners also feed the mixed-surface warning: do not mix
#     surfaces in one patch.
#   - `kind: infra` owners additionally emit a review note for `dependents`
#     ("all" = every feature surface) — the human decides follow-up, agents do
#     not negotiate.
#   - Glob forms: exact path, `dir/**` prefix, or fnmatch pattern (`*` may cross `/`).
#   - Code globs are repository-root-relative. The governance entries below use
#     `skills/role-governance/...` as a sample in-repository install path. The
#     checker auto-detects its own directory; adjust these ownership globs if
#     you install the skill elsewhere.
#   - Every role in `references/role-catalog.md` must appear in at least one
#     owner's `knowledge_roles`.
#
# Unowned-code checks: `unowned_code_roots` (top level) lists roots where
# unowned non-test changes block. Omit or empty to disable.
#
# System-map registration checks (optional, requires `references/system-map.md`):
#   - `system_map_checks.require`: globs whose new files must have their file
#     stem named in the system map (violation).
#   - `system_map_checks.warn`: globs whose new files should be named there
#     (warning only).
#   - `system_map_checks.modules`: directory roots whose new immediate
#     subdirectories must be registered (violation, matched by prefix globs).
# All globs are repository-root-relative; adapt the examples to your stack.

unowned_code_roots:
  - src/
  - backend/src/

system_map_checks:
  require:
    - "src/pages/*.tsx"
    - "src/contexts/*.tsx"
  warn:
    - "src/lib/*.ts"
    - "src/components/*.tsx"
  modules:
    - "backend/src/modules"

owners:
  # --- Product feature surfaces ---
  # Mapped roles are required only when their globs match changed files;
  # plain strings are the catch-all when nothing matches.
  - id: web-app
    kind: feature
    label: Main web application
    knowledge_roles:
      - product-analyst: src/pages/checkout/**
      - frontend-engineer: [src/pages/**, src/components/**]
      - experience-designer
      - quality-engineer
    code:
      - src/pages/**
      - src/components/**
    docs:
      - docs/architecture.md

  # --- Shared contracts ---
  - id: public-api
    kind: contract
    label: Public API and shared types
    knowledge_roles:
      - contract-architect
      - backend-engineer
      - contract-coordinator
      - quality-engineer
    code:
      - backend/src/api/**
      - backend/src/types/**
    docs:
      - docs/api-contract.md

  # --- Infrastructure ---
  - id: build-system
    kind: infra
    label: Build, CI, and tooling
    knowledge_roles:
      - release-engineer
      - incident-coordinator
      - quality-engineer
    code:
      - package.json
      - .github/**
    docs:
      - docs/ops.md
    dependents: all

  # --- Governance ---
  - id: governance
    kind: governance
    label: Skill rules, routing, and documentation
    docs_required: false
    knowledge_roles:
      - docs-governor
      - change-coordinator
    code:
      - skills/role-governance/SKILL.md
      - skills/role-governance/doc-ownership.yaml
      - skills/role-governance/rules/**
      - skills/role-governance/workflows/**
      - skills/role-governance/references/**
      - skills/role-governance/scripts/**
      - README.md
